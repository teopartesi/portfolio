
version: 2

updates:
  # 📦 Dépendances npm / Next.js
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Paris"

    open-pull-requests-limit: 5

    groups:
      # Garder Next.js et sa configuration ESLint ensemble
      nextjs:
        patterns:
          - "next"
          - "eslint-config-next"

      # Garder React et React DOM ensemble
      react:
        patterns:
          - "react"
          - "react-dom"

      # Regrouper les autres mises à jour non majeures
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ⚙️ Dépendances GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Paris"

    open-pull-requests-limit: 3

    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # 🐳 Image de base Docker
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Paris"

    open-pull-requests-limit: 3

    groups:
      docker-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

name: Deployment

on:
  workflow_call:
    inputs:
      release_ref:
        description: Git tag to check out for the image build and Compose file
        required: true
        type: string
      image_tag:
        description: Semantic version used to tag and deploy the Docker image
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: 🐳 Publish ${{ inputs.image_tag }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_ref }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/portfolio:${{ inputs.image_tag }}
            ghcr.io/${{ github.repository_owner }}/portfolio:latest

  deploy-vps:
    name: 🚀 Deploy ${{ inputs.image_tag }}
    runs-on: [self-hosted, linux, portfolio-prod]
    needs: publish
    environment: portfolio-prod
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_ref }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy Docker Compose stack
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail

          install -d /opt/docker/compose/portfolio
          docker network inspect proxy >/dev/null

          cp compose.prod.yaml /opt/docker/compose/portfolio/compose.yaml
          printf 'DOMAIN=teopartesi.fr\nIMAGE_TAG=%s\n' "$IMAGE_TAG" \
            > /opt/docker/compose/portfolio/.env

          cd /opt/docker/compose/portfolio
          docker compose config --quiet
          docker compose pull
          docker compose up -d --remove-orphans
          docker compose ps
          docker image prune -f

  deploy-azure:
    name: ☁️ Deploy ${{ inputs.image_tag }} to Azure
    runs-on: ubuntu-latest
    needs: publish
    environment: azure-lab
    permissions:
      id-token: write
    env:
      AZURE_RESOURCE_GROUP: rg-portfolio-cloud-lab
      AZURE_CONTAINER_APP: ca-portfolio-lab-hello
      IMAGE_REF: ghcr.io/teopartesi/portfolio:${{ inputs.image_tag }}

    steps:
      - name: Log in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy the release image
        run: |
          az extension add \
            --name containerapp \
            --upgrade \
            --only-show-errors

          az containerapp update \
            --name "$AZURE_CONTAINER_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "$IMAGE_REF" \
            --output none

      - name: Show Azure deployment
        run: |
          az containerapp show \
            --name "$AZURE_CONTAINER_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query '{image:properties.template.containers[0].image, revision:properties.latestRevisionName, revisionPrete:properties.latestReadyRevisionName}' \
            --output json
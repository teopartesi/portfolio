name: Portfolio Deployment

on:
  workflow_call:
    inputs:
      commit_sha:
        description: Commit SHA to check out for the image build and Compose file
        required: true
        type: string
      image_tag:
        description: Semantic version used to tag and deploy the Docker image
        required: true
        type: string
    secrets:
      VPS_SSH_KEY:
        required: true
      VPS_HOST:
        required: true
      VPS_USER:
        required: true
      VPS_PORT:
        required: false
      VPS_DEPLOY_PATH:
        required: false

permissions:
  contents: read

jobs:
  publish:
    name: 🐳 Publish ${{ inputs.image_tag }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit_sha }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/portfolio:${{ inputs.image_tag }}
            ghcr.io/${{ github.repository_owner }}/portfolio:latest

  deploy-vps:
    name: 🚀 Deploy ${{ inputs.image_tag }}
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: read

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit_sha }}

      - name: Deploy Docker Compose stack
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
          RELEASE_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail

          PORT="${VPS_PORT:-22}"
          DEPLOY_PATH="${VPS_DEPLOY_PATH:-/opt/docker/compose/portfolio}"
          SSH_TARGET="${VPS_USER}@${VPS_HOST}"

          mkdir -p "${HOME}/.ssh"

          KEY="${HOME}/.ssh/deploy_key"
          KNOWN_HOSTS="${HOME}/.ssh/known_hosts"

          printf '%s\n' "${VPS_SSH_KEY}" | tr -d '\r' > "${KEY}"
          chmod 600 "${KEY}"

          ssh-keyscan -p "${PORT}" -H "${VPS_HOST}" > "${KNOWN_HOSTS}"
          chmod 600 "${KNOWN_HOSTS}"

          test -s "${KEY}"
          test -s "${KNOWN_HOSTS}"

          ssh \
            -i "${KEY}" \
            -p "${PORT}" \
            -o IdentitiesOnly=yes \
            -o "UserKnownHostsFile=${KNOWN_HOSTS}" \
            "${SSH_TARGET}" \
            "mkdir -p '${DEPLOY_PATH}' && \
            (docker network inspect proxy >/dev/null 2>&1 || docker network create proxy)"

          scp \
            -i "${KEY}" \
            -P "${PORT}" \
            -o IdentitiesOnly=yes \
            -o "UserKnownHostsFile=${KNOWN_HOSTS}" \
            compose.prod.yaml \
            "${SSH_TARGET}:${DEPLOY_PATH}/compose.yaml"

          ssh \
            -i "${KEY}" \
            -p "${PORT}" \
            -o IdentitiesOnly=yes \
            -o "UserKnownHostsFile=${KNOWN_HOSTS}" \
            "${SSH_TARGET}" \
            "printf '%s\n%s\n' \
            'DOMAIN=teopartesi.fr' \
            'IMAGE_TAG=${RELEASE_IMAGE_TAG}' \
            > '${DEPLOY_PATH}/.env'"

          ssh \
            -i "${KEY}" \
            -p "${PORT}" \
            -o IdentitiesOnly=yes \
            -o "UserKnownHostsFile=${KNOWN_HOSTS}" \
            "${SSH_TARGET}" \
            "cd '${DEPLOY_PATH}' && \
            docker compose pull && \
            docker compose up -d --remove-orphans && \
            docker image prune -f"

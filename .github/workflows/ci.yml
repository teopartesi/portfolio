name: Portfolio CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: 🔨 Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Build application
        run: npm run build

  docker-smoke:
    name: 🐳 Docker Smoke Test
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build --tag portfolio:${{ github.sha }} .

      - name: Smoke test Docker image
        run: |
          docker run --detach --publish 3000:3000 --name portfolio portfolio:${{ github.sha }}

          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:3000 > /dev/null; then
              docker stop portfolio
              exit 0
            fi

            sleep 1
          done

          docker logs portfolio
          docker stop portfolio
          exit 1

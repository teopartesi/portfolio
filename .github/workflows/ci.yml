name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: 🔨 Build, Lint & Release Config
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Test release configuration
        run: npm run test:release-config

      - name: Build application
        run: npm run build

  build-docker:
    name: Build 🐳 Docker Image & ☢️ Trivy Scan
    runs-on: ubuntu-latest
    needs: frontend
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build portfolio image
        run: docker build --tag "portfolio:${{ github.sha }}" .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: portfolio:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          limit-severities-for-sarif: true
          exit-code: '1'
          ignore-unfixed: true

      - name: Save Trivy report
        uses: actions/upload-artifact@v4
        if: ${{ always() && hashFiles('trivy-results.sarif') != '' }}
        with:
          name: trivy-results
          path: trivy-results.sarif
          retention-days: 14
          
      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: ${{ always() && hashFiles('trivy-results.sarif') != '' }}
        with:
          sarif_file: 'trivy-results.sarif'
          category: trivy-portfolio
          
  docker-smoke:
    name: 🐳 Docker Smoke Test
    runs-on: ubuntu-latest
    needs: build-docker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build --tag portfolio:${{ github.sha }} .

      - name: Smoke test Docker image
        run: |
          docker run --detach --publish 3000:3000 --name portfolio portfolio:${{ github.sha }}

          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:3000 > /dev/null; then
              docker stop portfolio
              exit 0
            fi

            sleep 1
          done

          docker logs portfolio
          docker stop portfolio
          exit 1

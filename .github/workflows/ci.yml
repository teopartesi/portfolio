name: Portfolio CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 🔨 Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Build application
        run: npm run build

  docker:
    name: 🐳 Docker Build
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build --tag portfolio:${{ github.sha }} .

      - name: Smoke test Docker image
        run: |
          docker run --detach --publish 3000:3000 --name portfolio portfolio:${{ github.sha }}

          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:3000 > /dev/null; then
              docker stop portfolio
              exit 0
            fi

            sleep 1
          done

          docker logs portfolio
          docker stop portfolio
          exit 1

  push:
    name: 🐳 Push Docker Image
    runs-on: ubuntu-latest
    needs: docker
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/portfolio:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/portfolio:latest

  deploy-vps:
    name: 🚀 Deploy VPS
    runs-on: ubuntu-latest
    needs: push
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          PORT="${VPS_PORT:-22}"
          mkdir -p "${HOME}/.ssh"
          echo "${VPS_SSH_KEY}" > "${HOME}/.ssh/deploy_key"
          chmod 600 "${HOME}/.ssh/deploy_key"
          ssh-keyscan -p "${PORT}" -H "${VPS_HOST}" >> "${HOME}/.ssh/known_hosts"

      - name: Deploy Docker Compose stack
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          PORT="${VPS_PORT:-22}"
          DEPLOY_PATH="${VPS_DEPLOY_PATH:-/opt/docker/compose/portfolio}"
          SSH_TARGET="${VPS_USER}@${VPS_HOST}"
          SSH_OPTS="-i ${HOME}/.ssh/deploy_key -p ${PORT}"

          ssh ${SSH_OPTS} "${SSH_TARGET}" "mkdir -p '${DEPLOY_PATH}' && (docker network inspect proxy >/dev/null 2>&1 || docker network create proxy)"
          scp ${SSH_OPTS} compose.prod.yaml "${SSH_TARGET}:${DEPLOY_PATH}/compose.yaml"

          ssh ${SSH_OPTS} "${SSH_TARGET}" "printf '%s\n%s\n' 'DOMAIN=teopartesi.fr' 'IMAGE_TAG=${{ github.sha }}' > '${DEPLOY_PATH}/.env'"

          ssh ${SSH_OPTS} "${SSH_TARGET}" "cd '${DEPLOY_PATH}' && docker compose pull && docker compose up -d --remove-orphans && docker image prune -f"
